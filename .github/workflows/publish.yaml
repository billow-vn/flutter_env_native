name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # tag-pattern on pub.dev: 'v{{version}}'

env:
  flutter_version: "3.32.5"

jobs:
  publish:
    environment: pub.dev
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup dart
        uses: dart-lang/setup-dart@v1.7.0

      - name: Setup flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: 'stable'
          cache: true
          flutter-version: ${{ env.flutter_version }}

      - name: Install dependencies
        run: flutter pub get

      # Verify that the pushed tag matches the version in pubspec.yaml
      # This prevents publishing a wrong version to pub.dev (cannot be undone)
      - name: Verify tag matches version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match pubspec.yaml ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "✅ Tag matches version: $TAG_VERSION"

      - name: Publish - dry run
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force
